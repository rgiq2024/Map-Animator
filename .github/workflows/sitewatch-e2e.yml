name: Site watch check (live imagery)

# Manual check that Site watch can reach the imagery services and count ships / aircraft. Results are kept as
# a run artifact (contact sheets + result.json); nothing is committed.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'JSON list of cases'
        default: ''

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright
        run: npm i --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Run
        env:
          CASES: ${{ github.event.inputs.cases }}
        run: |
          python3 -m http.server 8811 >/dev/null 2>&1 &
          sleep 2
          node tools/sitewatch-e2e.mjs
      - name: Keep the contact sheets on the e2e-results branch
        if: always()
        run: |
          cd e2e && git init -q && git checkout -q -b e2e-results && git add . && git -c user.name=e2e -c user.email=e2e@users.noreply.github.com commit -qm "Site watch check $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" e2e-results
