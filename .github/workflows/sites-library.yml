name: Site list (Iran ports & air bases)

# Builds sites/iran.json — Iran's ports, naval bases, military air bases and airports from OpenStreetMap — for
# the Site watch tool, then redeploys the site. Run it by hand from the Actions tab; it refreshes once a month.
on:
  schedule:
    - cron: '17 4 9 * *'
  workflow_dispatch:
    inputs:
      raw:
        description: 'Also save the raw OSM / Wikidata answers'
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: sites-library
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the site list
        env:
          SITES_RAW: ${{ github.event.inputs.raw || '' }}
        run: node tools/sites-fetch.mjs
      - name: Commit
        run: |
          git config user.name "sites-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Site list $(date -u +%F)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
