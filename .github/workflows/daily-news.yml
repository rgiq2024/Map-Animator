name: Daily news feed

# Every 24 hours: fetch today's disasters and incidents (USGS, NASA EONET, GDACS, GDELT news, NASA FIRMS fires)
# into news/latest.json, then redeploy the site so the app's News desk shows them.
on:
  schedule:
    - cron: '17 2 * * *'   # 02:17 UTC every day
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch incidents
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: node tools/news-fetch.mjs
      - name: Commit the feed
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Daily news feed $(date -u +%F)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
