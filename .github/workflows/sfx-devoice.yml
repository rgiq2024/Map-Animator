name: Remove voices from clip sounds
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  devoice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install separation model
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q demucs soundfile
      - name: Separate voice from background (keep the background)
        run: |
          mkdir -p /tmp/sep
          for f in sfx/clips/*.mp3; do
            n=$(basename "$f" .mp3)
            ffmpeg -v error -y -i "$f" -ar 44100 -ac 2 "/tmp/sep/$n.wav"
            python -m demucs -n htdemucs --two-stems=vocals -o /tmp/sep/out "/tmp/sep/$n.wav"
            nv="/tmp/sep/out/htdemucs/$n/no_vocals.wav"
            v="/tmp/sep/out/htdemucs/$n/vocals.wav"
            ffmpeg -v error -i "$v" -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume" | sed "s/^/$n voice: /"
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$nv")
            st=$(python -c "print(max(0,$d-0.4))")
            ffmpeg -v error -y -i "$nv" -ac 2 -b:a 112k -af "afade=t=in:d=0.1,afade=t=out:st=$st:d=0.4" "$f"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add sfx/clips/*.mp3
          git commit -m "Clip sounds: voices removed (background kept)" || echo "nothing to commit"
          git pull --rebase -q origin main && git push origin HEAD:main
